# Defaults; the terragrunt unit (workload/nginx) overrides what it needs.

# Official nginx, unprivileged variant (listens on 8080, runs as UID 101).
# Pinned by tag AND multi-arch index digest: the tag is for humans, the
# digest is what the kubelet actually pulls.
image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: 1.30.5-alpine
  digest: sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 500m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi

nodeSelector: {}
topologySpreadConstraints: []

service:
  port: 80

ingress:
  enabled: false
  className: alb
  hostname: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 50

# ~1 RPS against the Service so `kubectl top` shows non-zero nginx metrics.
# Well below the HPA threshold — does not trigger scaling.
keepwarm:
  enabled: true
  image:
    repository: docker.io/library/busybox
    tag: "1.38.0"
    digest: sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
